<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (VERY IMPORTANT FOR SEO) -->
    <title>
      CloudXSecure | Cloud Security, Monitoring & Threat Protection Platform
    </title>

    <!-- Primary SEO Description -->
    <meta
      name="description"
      content="CloudXSecure is an advanced cloud security platform offering real-time monitoring, threat detection, compliance management, and secure cloud infrastructure protection for businesses."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="CloudXSecure, cloud security platform, cloud monitoring, cybersecurity, cloud threat detection, cloud infrastructure security, DevSecOps, secure cloud hosting, cloud compliance, cloud firewall, server security, VPS security"
    />

    <!-- Author & Branding -->
    <meta name="author" content="CloudXSecure Team" />
    <meta name="application-name" content="CloudXSecure" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cloudxsecure.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CloudXSecure | Smart Cloud Security & Monitoring" />
    <meta
      property="og:description"
      content="Protect your cloud infrastructure with CloudXSecure — real-time monitoring, security analytics, threat detection, and compliance made simple."
    />
    <meta property="og:url" content="https://cloudxsecure.com/" />
    <meta property="og:image" content="https://cloudxsecure.com/og-image.png" />
    <meta property="og:site_name" content="CloudXSecure" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloudXSecure | Advanced Cloud Security Platform" />
    <meta
      name="twitter:description"
      content="Enterprise-grade cloud security, monitoring, and threat protection powered by CloudXSecure."
    />
    <meta name="twitter:image" content="https://cloudxsecure.com/twitter-card.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0a0f2c" />

    <!-- Structured Data (Schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "CloudXSecure",
        "operatingSystem": "Web",
        "applicationCategory": "SecurityApplication",
        "description": "CloudXSecure is a professional cloud security and monitoring platform providing real-time protection, threat detection, and compliance for cloud infrastructure.",
        "url": "https://cloudxsecure.com/",
        "publisher": {
          "@type": "Organization",
          "name": "CloudXSecure"
        }
      }
    </script>
  </head>

  <body>
    <noscript>
      CloudXSecure requires JavaScript to run properly. Please enable JavaScript.
    </noscript>

    <div id="root"></div>

    <!-- Main Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
