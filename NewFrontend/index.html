<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title (UPDATED) -->
    <title>
      CloudXSecure | Cloud Security, AWS, DevOps & Managed Cloud Services
    </title>

    <!-- Primary SEO Description (UPDATED) -->
    <meta
      name="description"
      content="CloudXSecure offers cloud security, AWS/Azure consulting, DevOps, cloud migration, and managed cloud services for businesses across Mumbai and beyond"
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="CloudXSecure, cloud security platform, cloud monitoring, cybersecurity, cloud threat detection, cloud infrastructure security, DevSecOps, secure cloud hosting, cloud compliance, cloud firewall, server security, VPS security"
    />

    <!-- Author & Branding -->
    <meta name="author" content="CloudXSecure Team" />
    <meta name="application-name" content="CloudXSecure" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cloudxsecure.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./src/assets/Favicons.webp" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CloudXSecure | Smart Cloud Security & Monitoring" />
    <meta
      property="og:description"
      content="Protect your cloud infrastructure with CloudXSecure — real-time monitoring, security analytics, threat detection, and compliance made simple."
    />
    <meta property="og:url" content="https://cloudxsecure.com/" />
    <meta property="og:image" content="https://cloudxsecure.com/og-image.png" />
    <meta property="og:site_name" content="CloudXSecure" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloudXSecure | Advanced Cloud Security Platform" />
    <meta
      name="twitter:description"
      content="Enterprise-grade cloud security, monitoring, and threat protection powered by CloudXSecure."
    />
    <meta name="twitter:image" content="https://cloudxsecure.com/twitter-card.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0a0f2c" />

    <!-- Structured Data (UPDATED Schema.org to ProfessionalService) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "CloudXSecure",
        "image": "https://cloudxsecure.com/og-image.png",
        "url": "https://cloudxsecure.com",
        "telephone": "+91-7666488777",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "areaServed": "Mumbai, Thane, Navi Mumbai",
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AWS Consulting" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cloud Security & VAPT" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "DevOps Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cloud Migration" } }
        ]
      }
    </script>
  </head>

  <body>
    <noscript>
      CloudXSecure requires JavaScript to run properly. Please enable JavaScript.
    </noscript>

    <div id="root"></div>

    <!-- Main Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
