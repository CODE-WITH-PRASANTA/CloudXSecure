<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google Tag (gtag.js) - Google Ads: AW-18136967329 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-18136967329"></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        window.dataLayer.push(arguments);
      }

      gtag('js', new Date());

      // Base Google Ads tag
      gtag('config', 'AW-18136967329');

      // =====================================
      // CONTACT FORM CONVERSION
      // =====================================
      window.trackContactConversion = function (leadId) {
        if (typeof window.gtag !== 'function') {
          console.warn('Google Ads gtag not available');
          return;
        }

        window.gtag('event', 'conversion', {
          // TODO: Replace YOUR_CONTACT_CONVERSION_LABEL with your actual label
          send_to: 'AW-18136967329/YOUR_CONTACT_CONVERSION_LABEL',
          transaction_id: leadId ? String(leadId) : undefined
        });

        console.log('[Google Ads] Contact conversion fired', {
          leadId: leadId
        });
      };

      // =====================================
      // PHONE CLICK - Analytics Event
      // =====================================
      window.trackPhoneClick = function (url) {
        if (typeof window.gtag === 'function') {
          window.gtag('event', 'phone_click', {
            event_category: 'Contact',
            event_label: 'Phone Call Click'
          });
        }

        if (url) {
          window.location.href = url;
        }
      };

      // =====================================
      // WHATSAPP CLICK - Analytics Event
      // =====================================
      window.trackWhatsAppClick = function (url) {
        if (typeof window.gtag === 'function') {
          window.gtag('event', 'whatsapp_click', {
            event_category: 'Contact',
            event_label: 'WhatsApp Click'
          });
        }

        if (url) {
          window.open(url, '_blank', 'noopener,noreferrer');
        }
      };
    </script>

    <!-- Title -->
    <title>CloudXSecure | Cloud Security, AWS, DevOps & Managed Cloud Services</title>

    <!-- Primary SEO Description -->
    <meta
      name="description"
      content="CloudXSecure offers cloud security, AWS/Azure consulting, DevOps, cloud migration, and managed cloud services for businesses across Mumbai and beyond."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="CloudXSecure, cloud security platform, cloud monitoring, cybersecurity, cloud threat detection, cloud infrastructure security, DevSecOps, secure cloud hosting, cloud compliance, cloud firewall, server security, VPS security"
    />

    <!-- Author & Branding -->
    <meta name="author" content="CloudXSecure Team" />
    <meta name="application-name" content="CloudXSecure" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cloudxsecure.com/" />

    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/Favicons.webp" />

    <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CloudXSecure | Smart Cloud Security & Monitoring" />
    <meta
      property="og:description"
      content="Protect your cloud infrastructure with CloudXSecure — real-time monitoring, security analytics, threat detection, and compliance made simple."
    />
    <meta property="og:url" content="https://cloudxsecure.com/" />
    <meta property="og:image" content="https://cloudxsecure.com/og-image.png" />
    <meta property="og:site_name" content="CloudXSecure" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CloudXSecure | Advanced Cloud Security Platform" />
    <meta
      name="twitter:description"
      content="Enterprise-grade cloud security, monitoring, and threat protection powered by CloudXSecure."
    />
    <meta name="twitter:image" content="https://cloudxsecure.com/twitter-card.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#0a0f2c" />

        "telephone": "+91-7666488777",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Mumbai",
          "addressRegion": "Maharashtra",

        },

        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AWS Consulting" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cloud Security & VAPT" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "DevOps Services" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Cloud Migration" } }
        ]

  </head>
